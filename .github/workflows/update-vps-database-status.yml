name: Update VPS database status

on:
  schedule:
    # Every hour, at minute 17. GitHub may delay scheduled runs during high load.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Retrieve VPS database versions
        run: python .github/scripts/update_vps_versions.py

      - name: Commit a changed table
        run: |
          if git diff --quiet -- README.md; then
            echo "README table is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update VPS database versions"
          git push
